plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.extolab.extopay_lockscreen'
    compileSdk 34

    defaultConfig {
        applicationId "com.extolab.extopay_lockscreen"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        // Generates BuildConfig.VERSION_NAME / VERSION_CODE (off by default since AGP 8)
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // APK name: ExtoPay-Screen-Lock-MPOS-Release-V1.0.apk (Debug builds: ...-Debug-V1.0.apk)
    // Uses versionName from defaultConfig above.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "ExtoPay-Screen-Lock-MPOS-${variant.buildType.name.capitalize()}-V${variant.versionName}(b${variant.versionCode}).apk"
        }
    }
}

dependencies {
    // Put the WizarPOS CloudPOS SDK (cloudpossdkV1.8.3.13 .aar or .jar) into app/libs/.
    // The SDK must be 1.8.3.13 or newer: setPinLock / setPasswordLock / setPatternLock
    // are not in older versions.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}